name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.7"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run Ruff
        run: uv run ruff check src tests packages scripts
      - name: Run mypy
        run: uv run mypy src packages
      - name: Run pytest
        run: PYTHONPATH=. uv run pytest tests/
